<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b4f72"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d8d5cc" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- sheet -->
  <rect width="1200" height="900" fill="#f5f3ee"/>
  <rect x="40" y="40" width="1120" height="820" fill="url(#grid)" stroke="#12151a" stroke-width="2"/>

  <text x="70" y="88" fill="#8b8d93" font-size="18" letter-spacing="1">SIDE VIEW</text>

  <!-- main bearing supports -->
  <g fill="#eae7df" stroke="#12151a" stroke-width="2">
    <polygon points="200,438 260,438 275,480 185,480"/>
    <polygon points="570,438 630,438 645,480 555,480"/>
    <polygon points="932,438 992,438 1002,480 922,480"/>
  </g>

  <!-- snout + flywheel flange -->
  <rect x="110" y="382" width="85" height="36" fill="#eae7df" stroke="#12151a" stroke-width="2.5"/>
  <rect x="1005" y="320" width="50" height="160" fill="#eae7df" stroke="#12151a" stroke-width="2.5"/>

  <!-- throw 1: pin up (0°) -->
  <rect x="285" y="262" width="30" height="208" fill="#eae7df" stroke="#12151a" stroke-width="2.5"/>
  <rect x="515" y="262" width="30" height="208" fill="#eae7df" stroke="#12151a" stroke-width="2.5"/>
  <rect x="315" y="272" width="200" height="56" fill="#f5f3ee" stroke="#12151a" stroke-width="2.5"/>

  <!-- throw 2: pin down (180°) -->
  <rect x="655" y="330" width="30" height="208" fill="#eae7df" stroke="#12151a" stroke-width="2.5"/>
  <rect x="885" y="330" width="30" height="208" fill="#eae7df" stroke="#12151a" stroke-width="2.5"/>
  <rect x="685" y="472" width="200" height="56" fill="#f5f3ee" stroke="#12151a" stroke-width="2.5"/>

  <!-- main journals -->
  <g fill="#f5f3ee" stroke="#12151a" stroke-width="2.5">
    <rect x="195" y="372" width="90" height="56"/>
    <rect x="545" y="372" width="110" height="56"/>
    <rect x="915" y="372" width="90" height="56"/>
  </g>

  <!-- crank axis -->
  <line x1="80" y1="400" x2="1120" y2="400" stroke="#8b8d93" stroke-width="1.5" stroke-dasharray="24 6 4 6"/>

  <!-- pin labels -->
  <g fill="#1b4f72" font-size="18" letter-spacing="1" text-anchor="middle">
    <text x="415" y="306">CRANKPIN 1</text>
    <text x="785" y="506">CRANKPIN 2</text>
  </g>

  <!-- opposed cylinders -->
  <g stroke="#1b4f72" stroke-width="2">
    <line x1="415" y1="262" x2="415" y2="182" marker-end="url(#arrow)"/>
    <line x1="785" y1="538" x2="785" y2="618" marker-end="url(#arrow)"/>
  </g>
  <g fill="#1b4f72" font-size="18" letter-spacing="1" text-anchor="middle">
    <text x="415" y="164">TO CYL. 1</text>
    <text x="785" y="646">TO CYL. 2</text>
  </g>

  <!-- main labels -->
  <g fill="#12151a" font-size="18" letter-spacing="1" text-anchor="middle">
    <text x="230" y="512">MAIN 1</text>
    <text x="600" y="512">MAIN 2</text>
    <text x="962" y="512">MAIN 3</text>
  </g>
  <text x="1030" y="306" fill="#12151a" font-size="16" letter-spacing="1" text-anchor="middle">FLANGE</text>

  <!-- end view inset -->
  <rect x="90" y="590" width="330" height="186" fill="#f5f3ee" stroke="#12151a" stroke-width="2"/>
  <text x="106" y="616" fill="#8b8d93" font-size="16" letter-spacing="1">END VIEW — PHASING</text>
  <line x1="240" y1="632" x2="240" y2="764" stroke="#8b8d93" stroke-width="1" stroke-dasharray="6 4"/>
  <circle cx="240" cy="698" r="18" fill="#eae7df" stroke="#12151a" stroke-width="2"/>
  <circle cx="240" cy="698" r="3.5" fill="#12151a"/>
  <circle cx="240" cy="652" r="14" fill="#f5f3ee" stroke="#12151a" stroke-width="2"/>
  <circle cx="240" cy="744" r="14" fill="#f5f3ee" stroke="#12151a" stroke-width="2"/>
  <text x="266" y="658" fill="#12151a" font-size="16">PIN 1 · 0°</text>
  <text x="266" y="750" fill="#12151a" font-size="16">PIN 2 · 180°</text>
  <path d="M 210 668 A 34 34 0 0 0 210 728" fill="none" stroke="#1b4f72" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="140" y="704" fill="#1b4f72" font-size="16" letter-spacing="1">180°</text>

  <!-- notes -->
  <g fill="#12151a" font-size="18" letter-spacing="1">
    <text x="470" y="720">NOTES</text>
  </g>
  <g fill="#3a3d44" font-size="16" letter-spacing="0.5">
    <text x="470" y="746">1. THREE MAIN BEARINGS, TWO THROWS.</text>
    <text x="470" y="768">2. PINS 180° APART: OPPOSED PISTONS MOVE TOGETHER.</text>
  </g>

  <!-- ══ title block ══ -->
  <g>
    <rect x="40" y="796" width="1120" height="64" fill="#f5f3ee" stroke="#12151a" stroke-width="2"/>
    <line x1="760" y1="796" x2="760" y2="860" stroke="#12151a" stroke-width="1.2"/>
    <line x1="980" y1="796" x2="980" y2="860" stroke="#12151a" stroke-width="1.2"/>
    <text x="56" y="822" fill="#12151a" font-size="20" font-weight="bold" letter-spacing="1.5">180° FLAT-TWIN CRANKSHAFT</text>
    <text x="56" y="846" fill="#8b8d93" font-size="14" letter-spacing="1">SCHEMATIC ILLUSTRATION — NOT TO SCALE</text>
    <text x="776" y="822" fill="#12151a" font-size="14" letter-spacing="1">B18 SPECTRE</text>
    <text x="776" y="846" fill="#8b8d93" font-size="14" letter-spacing="1">EMAE 360 · FALL 2026</text>
    <text x="996" y="836" fill="#1b4f72" font-size="19" font-weight="bold" letter-spacing="1.5">FIG. 3</text>
  </g>
</svg>
