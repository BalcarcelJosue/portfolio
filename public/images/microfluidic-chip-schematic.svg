<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b4f72"/>
    </marker>
    <marker id="dot" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5">
      <circle cx="4" cy="4" r="3" fill="#12151a"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d8d5cc" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- sheet -->
  <rect width="1200" height="900" fill="#f5f3ee"/>
  <rect x="40" y="40" width="1120" height="820" fill="url(#grid)" stroke="#12151a" stroke-width="2"/>

  <text x="70" y="88" fill="#8b8d93" font-size="18" letter-spacing="1">SECTION VIEW — ILLUSTRATIVE</text>

  <!-- chip body -->
  <rect x="110" y="250" width="760" height="270" fill="#eae7df" stroke="#12151a" stroke-width="2.5"/>

  <!-- channel B (lower) and channel A (upper) -->
  <rect x="170" y="388" width="640" height="48" fill="#f5f3ee" stroke="#12151a" stroke-width="2"/>
  <rect x="240" y="330" width="500" height="48" fill="#f5f3ee" stroke="#12151a" stroke-width="2"/>

  <!-- porous membrane between channels -->
  <rect x="170" y="378" width="640" height="10" fill="#eae7df"/>
  <line x1="170" y1="383" x2="810" y2="383" stroke="#2e6da4" stroke-width="7" stroke-dasharray="12 6"/>

  <!-- ports: openings cut through the top of the chip -->
  <g fill="#f5f3ee">
    <rect x="180" y="248" width="26" height="142"/>
    <rect x="250" y="248" width="26" height="84"/>
    <rect x="704" y="248" width="26" height="84"/>
    <rect x="774" y="248" width="26" height="142"/>
  </g>
  <g stroke="#12151a" stroke-width="2">
    <line x1="180" y1="250" x2="180" y2="388"/><line x1="206" y1="250" x2="206" y2="378"/>
    <line x1="250" y1="250" x2="250" y2="330"/><line x1="276" y1="250" x2="276" y2="330"/>
    <line x1="704" y1="250" x2="704" y2="330"/><line x1="730" y1="250" x2="730" y2="330"/>
    <line x1="774" y1="250" x2="774" y2="378"/><line x1="800" y1="250" x2="800" y2="388"/>
  </g>
  <!-- tubing stubs -->
  <g fill="#f5f3ee" stroke="#12151a" stroke-width="2">
    <rect x="176" y="222" width="34" height="28"/>
    <rect x="246" y="222" width="34" height="28"/>
    <rect x="700" y="222" width="34" height="28"/>
    <rect x="770" y="222" width="34" height="28"/>
  </g>

  <!-- port labels -->
  <g stroke="#12151a" stroke-width="1" stroke-dasharray="3 4">
    <line x1="193" y1="222" x2="193" y2="160"/>
    <line x1="787" y1="222" x2="787" y2="160"/>
  </g>
  <g fill="#12151a" font-size="20" letter-spacing="1" text-anchor="middle">
    <text x="193" y="150">INLET B</text>
    <text x="263" y="205">INLET A</text>
    <text x="717" y="205">OUTLET A</text>
    <text x="787" y="150">OUTLET B</text>
  </g>

  <!-- flow -->
  <g stroke="#1b4f72" stroke-width="2" fill="none">
    <line x1="263" y1="232" x2="263" y2="300" marker-end="url(#arrow)"/>
    <line x1="717" y1="300" x2="717" y2="232" marker-end="url(#arrow)"/>
    <line x1="560" y1="354" x2="680" y2="354" marker-end="url(#arrow)"/>
    <line x1="560" y1="412" x2="740" y2="412" marker-end="url(#arrow)"/>
  </g>
  <g fill="#1b4f72" font-size="18" letter-spacing="1">
    <text x="300" y="361">CHANNEL A</text>
    <text x="230" y="419">CHANNEL B</text>
  </g>

  <!-- detail callout on membrane -->
  <circle cx="500" cy="383" r="22" fill="none" stroke="#12151a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="500" y1="405" x2="500" y2="590" stroke="#12151a" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- side labels -->
  <line x1="808" y1="383" x2="900" y2="470" stroke="#12151a" stroke-width="1" marker-start="url(#dot)"/>
  <text x="908" y="478" fill="#12151a" font-size="20" letter-spacing="1">POROUS</text>
  <text x="908" y="502" fill="#12151a" font-size="20" letter-spacing="1">MEMBRANE</text>
  <line x1="850" y1="505" x2="900" y2="580" stroke="#12151a" stroke-width="1" marker-start="url(#dot)"/>
  <text x="908" y="590" fill="#12151a" font-size="20" letter-spacing="1">CHIP BODY</text>

  <!-- detail A: magnified membrane -->
  <rect x="300" y="590" width="400" height="180" fill="#f5f3ee" stroke="#12151a" stroke-width="2"/>
  <text x="316" y="618" fill="#8b8d93" font-size="16" letter-spacing="1">DETAIL A — MEMBRANE PORES</text>
  <rect x="330" y="672" width="340" height="20" fill="#eae7df" stroke="#2e6da4" stroke-width="2"/>
  <g fill="#f5f3ee" stroke="#2e6da4" stroke-width="1.5">
    <rect x="356" y="672" width="12" height="20"/><rect x="412" y="672" width="12" height="20"/>
    <rect x="468" y="672" width="12" height="20"/><rect x="524" y="672" width="12" height="20"/>
    <rect x="580" y="672" width="12" height="20"/><rect x="636" y="672" width="12" height="20"/>
  </g>
  <g stroke="#1b4f72" stroke-width="1.6" fill="none">
    <line x1="418" y1="640" x2="418" y2="724" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="530" y1="640" x2="530" y2="724" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="642" y1="640" x2="642" y2="724" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="316" y="756" fill="#1b4f72" font-size="16" letter-spacing="1">EXCHANGE BETWEEN CHANNELS</text>

  <!-- ══ title block ══ -->
  <g>
    <rect x="40" y="796" width="1120" height="64" fill="#f5f3ee" stroke="#12151a" stroke-width="2"/>
    <line x1="760" y1="796" x2="760" y2="860" stroke="#12151a" stroke-width="1.2"/>
    <line x1="980" y1="796" x2="980" y2="860" stroke="#12151a" stroke-width="1.2"/>
    <text x="56" y="822" fill="#12151a" font-size="20" font-weight="bold" letter-spacing="1.5">TWO-CHANNEL MICROFLUIDIC CHIP</text>
    <text x="56" y="846" fill="#8b8d93" font-size="14" letter-spacing="1">GENERIC ILLUSTRATION — NOT A REAL DEVICE, NOT TO SCALE</text>
    <text x="776" y="822" fill="#12151a" font-size="14" letter-spacing="1">J. BALCÁRCEL</text>
    <text x="776" y="846" fill="#8b8d93" font-size="14" letter-spacing="1">FALL 2026</text>
    <text x="996" y="836" fill="#1b4f72" font-size="19" font-weight="bold" letter-spacing="1.5">SCHEM.</text>
  </g>
</svg>
